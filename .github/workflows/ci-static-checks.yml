name: "CI - Static Checks"

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types:
      - checks_requested

  schedule:
    - cron: "0 3 * * 1"
    - cron: "30 2 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  pre-commit:
    name: Pre-commit Checks
    if: >-
      (github.event_name == 'push') || (github.event_name == 'pull_request' && (github.base_ref == 'main')) || (github.event_name ==
      'merge_group')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.5"
          python-version: "3.13"
      - name: Install Just
        run: uv tool install rust-just==1.58.0
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        with:
          version: "0.10.14+7d59c7ec9"
          core-version: "0.10.14+7d59c7ec9"
      - name: Prepare development environment
        run: just install
      - name: Run repository checks
        run: just check
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: >-
      (github.event_name == 'pull_request') || (github.event_name == 'push') || (github.event_name == 'schedule' && (github.event.schedule
      == '0 3 * * 1')) || (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        if: matrix.language == 'c-cpp'
        with:
          version: "0.10.14+7d59c7ec9"
          core-version: "0.10.14+7d59c7ec9"
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Compile the native clock adapter
        if: matrix.build-mode == 'manual'
        run: cc -std=c11 -Wall -Wextra -Werror -I "$HOME/.moon/include" -c modules/cli/src/host/clock.c -o "$RUNNER_TEMP/clock.o"
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
  reports:
    name: Repository Audit
    if: >-
      ((github.event_name == 'push') || (github.event_name == 'schedule' && (github.event.schedule == '30 2 * * 1')) || (github.event_name
      == 'workflow_dispatch')) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.5"
          python-version: "3.13"
      - name: Scan full Git history for secrets
        if: ${{ !cancelled() }}
        run: |
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --redact --no-banner
      - run: |
          mkdir -p .artifacts/quality
          git ls-files -z '*.md' ':(exclude).agents/notes/**' |
            xargs -0 uvx --from lychee-bin==0.24.2 lychee --scheme https --scheme http \
              --no-progress --timeout 20 --max-retries 1 --format json --output .artifacts/quality/links.json
        if: ${{ !cancelled() }}
        shell: bash
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: repository-audit
          path: .artifacts/quality/
          include-hidden-files: true
          if-no-files-found: error

  workflow-audit:
    name: Online Workflow Audit
    if: >-
      ((github.event_name == 'push') || (github.event_name == 'schedule' && (github.event.schedule == '30 2 * * 1')) || (github.event_name
      == 'workflow_dispatch')) && (github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.5"
          python-version: "3.13"
      - name: Audit action provenance and references
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uvx --no-build --from jactionlint==2.3.0 --with shellcheck-py==0.11.0.1 --with pyflakes==3.4.0
          jactionlint --online=strict --shellcheck=shellcheck --pyflakes=pyflakes --online-report=workflow-audit.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: workflow-audit
          path: workflow-audit.json
          if-no-files-found: error
