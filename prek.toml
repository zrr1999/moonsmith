default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint" }]

[[repos]]
repo = "https://github.com/lycheeverse/lychee"
rev = "lychee-v0.24.2"
hooks = [
  { id = "lychee", files = "\\.md$", args = ["--offline", "--scheme", "file", "--no-progress"] },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.50.0"
hooks = [{ id = "typos", args = ["--force-exclude"] }]

[[repos]]
repo = "https://github.com/instrumentl/pre-commit-just"
rev = "v0.2"
hooks = [{ id = "check-justfile" }]

[[repos]]
repo = "https://github.com/zendev-lab/zendev"
rev = "v0.4.0"
hooks = [
  { id = "zendev-message-check", args = ["--profile", "zendev"], stages = ["commit-msg"] },
  { id = "zendev-proposal-check", stages = ["pre-commit"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "moon-fmt", name = "MoonBit format", entry = "moon fmt --check", language = "system", files = "(^moon\\.mod$|(^|/)moon\\.pkg$|\\.mbt(i|x)?$)", pass_filenames = false },
  { id = "moon-check", name = "MoonBit type check", entry = "moon check --target native --deny-warn", language = "system", files = "(^moon\\.mod$|(^|/)moon\\.pkg$|\\.mbt(i|x)?$)", pass_filenames = false },
]
