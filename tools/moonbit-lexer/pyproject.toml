[project]
name = "moonbit-pygments"
version = "0.10.16"
description = "Pygments lexer for MoonBit, taken from moonbit-docs tag v0.10.16."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["pygments>=2.19"]

[project.entry-points."pygments.lexers"]
moonbit = "moonbit_pygments:MoonBitLexer"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moonbit_pygments"]
