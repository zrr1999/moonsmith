name: Policy - PR

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: policy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-message:
    name: PR message
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check PR title
        uses: zendev-lab/zendev/actions/validate-title@f3b5d8e7c55524e34be316c9824275ad43e8de56 # v0.5.0
        with:
          text: ${{ github.event.pull_request.title }}
          profile: zendev
      - name: Check PR body
        if: github.event.pull_request.user.login != 'renovate[bot]'
        uses: zendev-lab/zendev/actions/validate-body@f3b5d8e7c55524e34be316c9824275ad43e8de56 # v0.5.0
        with:
          body: ${{ github.event.pull_request.body }}
  # A skipped required check counts as a pass. always() keeps this job running
  # when a dependency fails, so the ruleset sees the result below.
  required:
    name: All Required Checks Passed (Policy)
    needs: [pr-message]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') }}
        run: '[[ "$FAILED" != "true" ]]'
