default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-symlinks" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md"] },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-illegal-windows-names" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "destroyed-symlinks" },
  { id = "forbid-new-submodules" },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.5.0"
hooks = [
  { id = "tombi-format", args = ["--check", "--offline"] },
  { id = "tombi-lint", args = ["--error-on-warnings", "--offline"] },
]

[[repos]]
repo = "https://github.com/adrienverge/yamllint"
rev = "v1.38.0"
hooks = [{ id = "yamllint", args = ["--strict", "--config-file", ".yamllint.yml"] }]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.78"
hooks = [{ id = "rumdl-check", args = ["--config", ".rumdl.toml", "--deny-config-warnings"] }]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.38.2"
hooks = [
  { id = "check-renovate" },
  { id = "check-metaschema", files = "^schemas/.*\\.schema\\.json$" },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint" }]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.30.0"
hooks = [{ id = "zizmor", args = ["--offline", "--no-progress", "--strict-collection"] }]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks", name = "Gitleaks working tree", entry = "gitleaks dir . --config .gitleaks.toml --redact --no-banner --log-level warn", always_run = true },
]

[[repos]]
repo = "https://github.com/lycheeverse/lychee"
rev = "lychee-v0.24.2"
hooks = [
  { id = "lychee", files = "\\.md$", args = ["--offline", "--scheme", "file", "--include-fragments", "--no-progress"] },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.50.0"
hooks = [{ id = "typos", args = ["--force-exclude"] }]

[[repos]]
repo = "https://github.com/instrumentl/pre-commit-just"
rev = "v0.2"
hooks = [{ id = "check-justfile" }]

[[repos]]
repo = "https://github.com/asamarts/alint-pre-commit"
rev = "v0.17.0"
hooks = [{ id = "alint" }]

[[repos]]
repo = "https://github.com/zendev-lab/zendev"
rev = "v0.4.0"
hooks = [
  { id = "zendev-message-check", args = ["--profile", "zendev"], stages = ["commit-msg"] },
  { id = "zendev-proposal-check", stages = ["pre-commit"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "moon-fmt", name = "MoonBit format", entry = "moon fmt --check", language = "system", files = "((^|/)moon\\.(work|mod|pkg)$|\\.mbt(i|x)?$)", pass_filenames = false },
  { id = "moon-check", name = "MoonBit type check", entry = "moon check --target native --deny-warn", language = "system", files = "((^|/)moon\\.(work|mod|pkg)$|\\.mbt(i|x)?$)", pass_filenames = false },
]
