name: "CI - Tests"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  historical:
    name: Historical Compiler Regressions (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-15
            platform: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set historical validation directory
        run: echo "HISTORICAL_ROOT=$RUNNER_TEMP/moonsmith-historical" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.5"
          python-version: "3.13"
      - name: Install Just
        run: uv tool install rust-just==1.58.0
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        with:
          version: "0.10.18+6c83a7f62"
          core-version: "0.10.18+6c83a7f62"
      - run: moon update
      - name: Build MoonSmith with the development compiler
        run: |
          just build-historical
          just test-historical-guard
          mkdir -p "$HISTORICAL_ROOT/.artifacts"
          cp -R .artifacts/historical-bin "$HISTORICAL_ROOT/.artifacts/"
      - name: Install moonc 0.10.14
        env:
          MOONBIT_HOME: ${{ runner.temp }}/moonc-0.10.14
        uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        with:
          version: "0.10.14+7d59c7ec9"
          core-version: "0.10.14+7d59c7ec9"
      - name: Test moonc 0.10.14 regressions and CLI
        env:
          COMPILER_HOME: ${{ runner.temp }}/moonc-0.10.14
          COMPILER_OUTPUT: runs/moonc-0.10.14
        run: just --justfile "$GITHUB_WORKSPACE/justfile" --working-directory "$HISTORICAL_ROOT" test-historical test-compiler
      - name: Install moonc 0.10.11
        env:
          MOONBIT_HOME: ${{ runner.temp }}/moonc-0.10.11
        uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        with:
          version: "0.10.11+6ff76a5f9"
          core-version: "0.10.11+6ff76a5f9"
      - name: Test the CLI with moonc 0.10.11
        env:
          COMPILER_HOME: ${{ runner.temp }}/moonc-0.10.11
          COMPILER_OUTPUT: runs/moonc-0.10.11
        run: just --justfile "$GITHUB_WORKSPACE/justfile" --working-directory "$HISTORICAL_ROOT" test-compiler
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: historical-guard-${{ matrix.platform }}
          path: |
            .artifacts/historical-rejection.log
            .artifacts/historical-rejection.err
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: historical-compiler-evidence-${{ matrix.platform }}
          retention-days: 7
          path: |
            ${{ env.HISTORICAL_ROOT }}/runs/**/*.json
            ${{ env.HISTORICAL_ROOT }}/runs/**/*.toml
            ${{ env.HISTORICAL_ROOT }}/runs/**/*.mbt
            ${{ env.HISTORICAL_ROOT }}/runs/**/moon.mod
            ${{ env.HISTORICAL_ROOT }}/runs/**/moon.pkg
            ${{ env.HISTORICAL_ROOT }}/runs/**/*.md
            ${{ env.HISTORICAL_ROOT }}/runs/**/native/release/build/generated.c
  test:
    name: Behavior Tests (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-15
            platform: macos-arm64
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.5"
          python-version: "3.13"
      - name: Install Just
        run: uv tool install rust-just==1.58.0
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        with:
          version: "0.10.18+6c83a7f62"
          core-version: "0.10.18+6c83a7f62"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.3.1"
      - name: Update MoonBit package index
        run: moon update
      - name: Build workspace modules
        run: just build
      - name: Run tests with native coverage
        if: runner.os == 'Linux'
        run: just coverage
      - name: Run tests on macOS
        if: runner.os == 'macOS'
        run: just test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: execution-evidence-${{ matrix.platform }}
          retention-days: 7
          path: |
            runs/**/*.json
            runs/**/*.toml
            runs/**/*.mbt
            runs/**/moon.mod
            runs/**/moon.pkg
            runs/**/*.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        with:
          name: native-coverage
          path: .artifacts/quality/coverage*
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload native coverage
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: .artifacts/quality/coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
  # A skipped required check counts as a pass. always() keeps this job running
  # when a dependency fails, so the ruleset sees the result below.
  required:
    name: All Required Checks Passed (Tests)
    needs: [test, historical]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate job results
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') }}
        run: '[[ "$FAILED" != "true" ]]'
