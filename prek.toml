default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-symlinks" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer", args = ["--check"] },
  { id = "mixed-line-ending", args = ["--fix=no"] },
  { id = "trailing-whitespace", args = ["--markdown-linebreak-ext=md", "--check"] },
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-illegal-windows-names" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "destroyed-symlinks" },
  { id = "forbid-new-submodules" },
]

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.9.0"
hooks = [
  { id = "tombi-format", args = ["--check", "--offline"] },
  { id = "tombi-lint", args = ["--error-on-warnings", "--offline"] },
]

[[repos]]
repo = "https://github.com/adrienverge/yamllint"
rev = "v1.38.0"
hooks = [{ id = "yamllint", args = ["--strict", "--config-file", ".yamllint.yml"] }]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.3.0"
hooks = [{ id = "rumdl-check", args = ["--config", ".rumdl.toml", "--deny-config-warnings"] }]

[[repos]]
repo = "https://github.com/python-jsonschema/check-jsonschema"
rev = "0.38.2"
hooks = [
  { id = "check-renovate" },
  { id = "check-metaschema", files = "^schemas/.*\\.schema\\.json$" },
]

[[repos]]
repo = "https://github.com/jdx/jactionlint"
rev = "v2.3.0"
hooks = [
  # The upstream hook installs jactionlint and ShellCheck; uvx supplies isolated Pyflakes.
  { id = "jactionlint-shellcheck", name = "GitHub Actions correctness and security", entry = "uvx --from pyflakes==3.4.0 jactionlint", args = ["--no-online", "--shellcheck=shellcheck", "--pyflakes=pyflakes"], pass_filenames = false, types = ["file"], files = '^(\.github/|(.*/)?action\.ya?ml$|prek\.toml$)' },
]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "v1.31.1"
hooks = [{ id = "zizmor", args = ["--offline", "--no-progress", "--strict-collection"] }]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
  { id = "gitleaks", name = "Gitleaks working tree", entry = "gitleaks dir . --config .gitleaks.toml --redact --no-banner --log-level warn", always_run = true },
]

[[repos]]
repo = "https://github.com/lycheeverse/lychee"
rev = "lychee-v0.24.2"
hooks = [
  # Remove LYCHEE_VERSION after upgrading to a release containing https://github.com/lycheeverse/lychee/pull/2293.
  { id = "lychee", name = "Repository Markdown links", files = "\\.md$", args = ["LYCHEE_VERSION=0.24.2", "--offline", "--scheme", "file", "--include-fragments", "--no-progress"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "vale", name = "Documentation terminology", entry = "vale", language = "python", additional_dependencies = ["vale==3.25.1.0"], types = ["markdown"], require_serial = true },
  { id = "ast-grep", name = "Host monotonic clock contract", entry = "ast-grep scan", language = "python", additional_dependencies = ["ast-grep-cli==0.51.0"], pass_filenames = false, files = "(\\.c$|^quality/ast-grep/|^sgconfig\\.yml$)" },
  { id = "ast-grep-tests", name = "Clock rule examples", entry = "ast-grep test --skip-snapshot-tests", language = "python", additional_dependencies = ["ast-grep-cli==0.51.0"], pass_filenames = false, files = "^quality/ast-grep" },
]

[[repos]]
repo = "https://github.com/crate-ci/typos"
rev = "v1.51.1"
hooks = [{ id = "typos", args = ["--force-exclude"] }]

[[repos]]
repo = "https://github.com/instrumentl/pre-commit-just"
rev = "v0.2"
hooks = [{ id = "check-justfile" }]

[[repos]]
repo = "https://github.com/asamarts/alint-pre-commit"
rev = "v0.20.0"
hooks = [{ id = "alint" }]

[[repos]]
repo = "https://github.com/zendev-lab/zendev"
rev = "v0.5.0"
hooks = [
  { id = "zendev-message-check", args = ["--profile", "zendev"], stages = ["commit-msg"] },
  { id = "zendev-proposal-check", stages = ["pre-commit"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "moon-fmt", name = "MoonBit format", entry = "moon fmt --check", language = "system", files = "((^|/)moon\\.(work|mod|pkg)$|\\.mbt(i|x)?$)", pass_filenames = false },
  { id = "moon-check", name = "MoonBit type check", entry = "moon check --target native --deny-warn", language = "system", files = "((^|/)moon\\.(work|mod|pkg)$|\\.mbt(i|x)?$)", pass_filenames = false },
]

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.17.3"
hooks = [
  { id = "ruff-check" },
  { id = "ruff-format", args = ["--check"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "release-tests", name = "Release artifact and publication guards", entry = "python -m unittest discover -s scripts -p test_release.py", language = "python", pass_filenames = false, files = "^scripts/.*\\.py$" },
]
