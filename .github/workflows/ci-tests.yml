name: "CI - Tests"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
    types:
      - checks_requested
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  historical:
    name: Historical Compiler Regressions (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-15
            platform: macos-arm64
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set historical validation directory
        run: echo "HISTORICAL_ROOT=$RUNNER_TEMP/moonsmith-historical" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.5"
          python-version: "3.13"
      - name: Install Just
        run: uv tool install rust-just==1.58.0
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        with:
          version: "0.10.18+6c83a7f62"
          core-version: "0.10.18+6c83a7f62"
      - run: moon update
      - name: Build checks with the development compiler
        run: |
          just build-historical
          just test-historical-guard
          mkdir -p "$HISTORICAL_ROOT/.artifacts"
          cp -R .artifacts/historical-bin "$HISTORICAL_ROOT/.artifacts/"
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        with:
          version: "0.10.14+7d59c7ec9"
          core-version: "0.10.14+7d59c7ec9"
      - name: Reproduce historical compiler failures
        run: just --justfile "$GITHUB_WORKSPACE/justfile" --working-directory "$HISTORICAL_ROOT" test-historical
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: historical-guard-${{ matrix.platform }}
          path: |
            .artifacts/historical-rejection.log
            .artifacts/historical-rejection.err
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: historical-compiler-evidence-${{ matrix.platform }}
          retention-days: 7
          path: |
            ${{ env.HISTORICAL_ROOT }}/runs/**/*.json
            ${{ env.HISTORICAL_ROOT }}/runs/**/*.toml
            ${{ env.HISTORICAL_ROOT }}/runs/**/*.mbt
            ${{ env.HISTORICAL_ROOT }}/runs/**/moon.mod
            ${{ env.HISTORICAL_ROOT }}/runs/**/moon.pkg
            ${{ env.HISTORICAL_ROOT }}/runs/**/*.md
            ${{ env.HISTORICAL_ROOT }}/runs/**/native/release/build/generated.c
  test:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.5"
          python-version: "3.13"
      - name: Install Just
        run: uv tool install rust-just==1.58.0
      - name: Install the compiler under test
        env:
          MOONBIT_HOME: ${{ runner.temp }}/moon-sut
        uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        with:
          version: "0.10.14+7d59c7ec9"
          core-version: "0.10.14+7d59c7ec9"
      - name: Install the development compiler
        uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        with:
          version: "0.10.18+6c83a7f62"
          core-version: "0.10.18+6c83a7f62"
      - name: Record the development compiler
        run: echo "DEV_MOON=$(command -v moon)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.3.1"
      - name: Update MoonBit package index
        run: moon update
      - name: Install CLI from the clean workspace
        run: moon install ./modules/cli/src/cmd/moonsmith --bin "${RUNNER_TEMP}/moonsmith-bin"
      - name: Validate installed CLI outside the workspace
        working-directory: ${{ runner.temp }}
        env:
          MOONSMITH_SUT_BIN: ${{ runner.temp }}/moon-sut/bin
        run: |
          export PATH="$MOONSMITH_SUT_BIN:$PATH"
          validation_root="${RUNNER_TEMP}/moonsmith-acceptance"
          mkdir -p "${validation_root}"
          cd "${validation_root}"
          installed_cli="${RUNNER_TEMP}/moonsmith-bin/moonsmith"
          "${installed_cli}" --help
          "${installed_cli}" run --set seed_start=42 \
            --set 'execution.configurations=["native-debug","native-release","wasm-gc-debug","wasm-debug","js-debug"]' \
            --set "output.directory=\"${GITHUB_WORKSPACE}/runs/installed-cli\""
          sample_records=("${GITHUB_WORKSPACE}"/runs/installed-cli/task-*/samples/0.json)
          test "${#sample_records[@]}" -eq 1
          validation_case=$(jq -er '.outcome | select(.[0] == "Observed") | .[1].case_directory' "${sample_records[0]}")
          summary_file="${sample_records[0]%/samples/0.json}/summary.json"
          jq -e '.format_version == 2 and .attempted == 1 and .generated_valid == 1 and
            .baseline_accepted == 1 and .comparisons_complete == 1 and .consistent == 1 and
            .operation_errors == 0' "${summary_file}"
          sha256sum "${validation_case}/case.json" "${validation_case}/original.mbt" \
            "${summary_file}" > before.sha256
          "${installed_cli}" replay "${validation_case}"
          sha256sum --check before.sha256
      - name: Build workspace modules
        run: just build
      - name: Run tests with native coverage
        env:
          MOONSMITH_DEV_MOON: ${{ env.DEV_MOON }}
          MOONSMITH_SUT_BIN: ${{ runner.temp }}/moon-sut/bin
        run: just coverage
      - name: Run differential compiler testing
        env:
          MOONSMITH_DEV_MOON: ${{ env.DEV_MOON }}
          MOONSMITH_SUT_BIN: ${{ runner.temp }}/moon-sut/bin
        run: |
          export PATH="$MOONSMITH_SUT_BIN:$PATH"
          "$MOONSMITH_DEV_MOON" run modules/cli/src/cmd/moonsmith --target native --deny-warn -- run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: execution-evidence
          retention-days: 7
          path: |
            runs/**/*.json
            runs/**/*.toml
            runs/**/*.mbt
            runs/**/moon.mod
            runs/**/moon.pkg
            runs/**/*.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: native-coverage
          path: .artifacts/quality/coverage*
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload native coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: .artifacts/quality/coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
