name: "CI - Acceptance"

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/**/moon.mod"
      - "scripts/**"
      - ".github/workflows/ci-acceptance.yml"
      - ".github/workflows/cd-publish.yml"
  workflow_dispatch:
    inputs:
      full_acceptance:
        description: "Run seeds 0-99 with all five configurations and equivalent variants"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Acceptance (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-15
            platform: macos-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.13.5"
          python-version: "3.13"
      - name: Install Just
        run: uv tool install rust-just==1.58.0
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        with:
          version: "0.10.18+6c83a7f62"
          core-version: "0.10.18+6c83a7f62"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.3.1"
          package-manager-cache: false
      - name: Check and build the product
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          just install
          just check
          just build
          just test
          just coverage
          just benchmark
      - name: Validate packages and installed release executable
        env:
          FULL_ACCEPTANCE: ${{ inputs.full_acceptance && 'true' || 'false' }}
        run: |
          args=()
          if [ "$FULL_ACCEPTANCE" = true ]; then
            args+=(--full)
          fi
          python scripts/acceptance.py prepare "${args[@]}"
          cp -R .artifacts/quality .artifacts/acceptance/evidence/quality
      - name: Build historical checks with the product compiler
        run: |
          just build-historical
          just test-historical-guard
      - uses: hustcer/setup-moonbit@87e2bdf5cf20d3b6f5c5f266a8a513f503bb5b76 # v1.25
        with:
          version: "0.10.14+7d59c7ec9"
          core-version: "0.10.14+7d59c7ec9"
      - name: Validate historical failures outside the workspace
        run: python scripts/acceptance.py historical
      - name: Package verified evidence
        run: python scripts/acceptance.py archive
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-${{ matrix.platform }}
          path: |
            .artifacts/acceptance/*.tar.gz
            .artifacts/acceptance/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 21
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: acceptance-diagnostics-${{ matrix.platform }}
          path: |
            .artifacts/acceptance/evidence
            .artifacts/quality
          include-hidden-files: true
